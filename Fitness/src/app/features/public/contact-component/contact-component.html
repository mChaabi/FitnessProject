<section class="contact-container">
  <div class="contact-card">
    <h2>Contactez-<span>nous</span></h2>
    <p>Une question ? Notre équipe vous répond sous 24h.</p>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" formControlName="nom" placeholder="Votre nom">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="votre@email.com">
      </div>

      <div class="form-group">
        <label>Sujet</label>
        <select formControlName="sujet">
          <option value="">Choisissez un sujet</option>
          <option value="info">Informations cours</option>
          <option value="coach">Suivi coaching</option>
          <option value="tech">Problème technique</option>
        </select>
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea formControlName="message" rows="5" placeholder="Comment pouvons-nous vous aider ?"></textarea>
      </div>

      <button type="submit" [disabled]="contactForm.invalid" class="btn-submit">
        Envoyer le message
      </button>
    </form>
  </div>
</section>
