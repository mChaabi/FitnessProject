name: fitforge

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: fitness_db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./fitnessBackEnd
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/fitness_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      UNSUB_SECRET: ${UNSUB_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_ENABLED: ${AI_ENABLED}
      CORS_ORIGINS: http://localhost:${WEB_PORT}
      APP_FRONTEND_URL: http://localhost:${WEB_PORT}
      APP_PUBLIC_API_URL: http://localhost:${WEB_PORT}/api
      # TEMPORAL: ver el aviso del Paso 6
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

  web:
    build: ./Fitness
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${WEB_PORT}:80"]

volumes:
  db_data: