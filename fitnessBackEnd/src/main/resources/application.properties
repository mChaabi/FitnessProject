spring.application.name=fitnessBackEnd
server.port=8080
spring.profiles.default=dev

# ===============================
# DATABASE CONNECTION (MySQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitness_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# Using validate for production/Flyway safety (or change to 'update' if preferred for local dev)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# FLYWAY MIGRATIONS
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# SERVER CONFIGURATION
# ===============================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=native

# ===============================
# ACTUATOR / HEALTH
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===============================
# AUTHENTICATION & SECURITY (JWT)
# ===============================
app.jwt.secret=${JWT_SECRET:solo-desarrollo-local-no-usar-en-produccion-0123456789}
app.jwt.expiration-minutes=120
app.auth.refresh-days=7
app.auth.refresh-grace-seconds=10
app.auth.max-failures=5
app.auth.lock-minutes=15
app.auth.cookie-secure=false
app.auth.cookie-path=/api/auth
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===============================
# ADMIN USER CONFIGURATION
# ===============================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ===============================
# APP BUSINESS CONFIG (Classes & Dashboard)
# ===============================
app.classes.cancel-hours=2
app.classes.generate-days=28

app.dashboard.inactivity-days=14
app.dashboard.expiring-days=7

# ===============================
# MAIL CONFIGURATION (Mailtrap)
# ===============================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=noreply@fitforge.com
app.mail.from-name=FitForge
app.mail.unsub-secret=${UNSUB_SECRET:solo-desarrollo-local-0123456789abcdef}
app.mail.dispatch-interval-ms=15000
app.mail.send-delay-ms=1200
app.mail.max-attempts=5
app.frontend-url=http://localhost:4200
app.public-api-url=http://localhost:8080

# Crons
app.mail.reminder-cron=0 0 * * * *
app.mail.expiring-cron=0 0 9 * * *
app.mail.risk-cron=0 0 10 * * *

# ===============================
# AI CONFIGURATION (LangChain4j)
# ===============================
app.ai.enabled=${AI_ENABLED:true}
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=gemini-2.5-flash
app.ai.timeout-seconds=20


# ===============================
# SYSTEM TASKS & OVERRIDES
# ===============================
spring.task.scheduling.pool.size=4
spring.main.allow-bean-definition-overriding=true

# Desactivar gestión JMX si causa conflictos locales
spring.jmx.enabled=false